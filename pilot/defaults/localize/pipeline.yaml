# Localize pipeline — translate content list into multiple locales
# Flow: pick_content → localize → save_output → [next item] → merge
#
# For each content item:
#   1. pick_content: extract item, create en/{id}.json (reshape only)
#   2. localize: LLM translates all locales, writes data/translations.json
#   3. save_output: shell distributes translations to {locale}/{id}.json
# After all items:
#   4. merge: combine {id}.json files per locale folder into content.json
version: "0.1"
starting: pick_content

vars:
  LOCALES: "es,fr,de,it,pt,nl,ja,ko,zh"
  INPUT_FILE: ""                            # REQUIRED. Path to JSON array of content items
  OUTPUT_DIR: ""                            # REQUIRED. Base output directory (subfolders per locale)
  CURRENT_INDEX: "0"

pre_pipeline: |
  set -euo pipefail

  if [ -z "${INPUT_FILE:-}" ]; then
    echo "INPUT_FILE is required — set it in pipeline.yaml vars or .pilot/vars"
    exit 1
  fi

  if [ ! -f "$INPUT_FILE" ]; then
    echo "INPUT_FILE not found: $INPUT_FILE"
    exit 1
  fi

  if [ -z "${OUTPUT_DIR:-}" ]; then
    echo "OUTPUT_DIR is required — set it in pipeline.yaml vars or .pilot/vars"
    exit 1
  fi

  if ! command -v jq &>/dev/null; then
    echo "jq not found — install jq first"
    exit 1
  fi

  mkdir -p "$PILOT_CONFIG_DIR/data"
  TOTAL=$(jq 'length' "$INPUT_FILE")
  echo "Input: $TOTAL items, Locales: en (source), $LOCALES"

stages:
  # Extract next content item, create en/{id}.json (reshape only)
  pick_content:
    runner:
      executor: shell
      command: |
        {{file:scripts/pick_content.sh}}
    on_signal:
      ready: localize
      completed: merge
      default: __fail__

  # LLM translates to all locales, writes data/translations.json
  localize:
    prompt: |
      {{file:prompts/localize.md}}
    runner:
      executor: claude-code
      model: sonnet
    on_signal:
      completed: save_output
      failed: __fail__
      default: save_output

  # Distribute translations.json to {locale}/{id}.json files
  save_output:
    runner:
      executor: shell
      command: |
        {{file:scripts/save_output.sh}}
    on_signal:
      completed: pick_content
      default: pick_content

  # Combine all {id}.json per locale into content.json
  merge:
    runner:
      executor: shell
      command: |
        {{file:scripts/merge.sh}}
    on_signal:
      completed: __succeed__
      default: __succeed__
