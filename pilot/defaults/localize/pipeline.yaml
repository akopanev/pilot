# Localize pipeline — translate content list into multiple locales
# Flow: pick_content → localize → save_output → [next item] → merge
#
# For each content item:
#   1. pick_content: extract item, create en/{id}.json (reshape only)
#   2. localize: LLM spawns parallel agents (one per locale), each writes {locale}/{id}.json
#   3. save_output: advance to next content item
# After all items:
#   4. merge: combine {id}.json files per locale folder into content.json
version: "0.1"
starting: pick_content

vars:
  LOCALES: "es,fr,de,it,pt,nl,ja,ko,zh"
  INPUT_FILE: ""                            # REQUIRED. Relative to project root
  OUTPUT_DIR: ""                            # REQUIRED. Relative to project root
  CURRENT_INDEX: "0"

pre_pipeline: |
  set -euo pipefail
  if ! command -v jq &>/dev/null; then
    echo "jq not found — install jq first"
    exit 1
  fi
  mkdir -p "$PILOT_CONFIG_DIR/data"
  echo "Pre-pipeline OK"

stages:
  # Extract next content item, create en/{id}.json (reshape only)
  pick_content:
    runner:
      executor: shell
      command: |
        {{file:scripts/pick_content.sh}}
    on_signal:
      ready: localize
      completed: merge
      default: __fail__

  # Spawn parallel agents — one per locale — each writes {locale}/{id}.json
  localize:
    prompt: |
      {{file:prompts/localize.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: save_output
      failed: __fail__
      default: save_output

  # Advance to next content item
  save_output:
    runner:
      executor: shell
      command: |
        {{file:scripts/save_output.sh}}
    on_signal:
      completed: pick_content
      default: pick_content

  # Combine all {id}.json per locale into content.json
  merge:
    runner:
      executor: shell
      command: |
        {{file:scripts/merge.sh}}
    on_signal:
      completed: __succeed__
      default: __succeed__
