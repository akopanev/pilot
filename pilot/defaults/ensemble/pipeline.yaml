# Ensemble pipeline — three sparring partners answer the same question in parallel
#
# Run directly:
#   pilot run .pilot/ensemble/pipeline.yaml --var QUESTION="your question"
#
# Or install as a Claude Code skill, then use /ensemble in a Claude session:
#   pilot init-skill ensemble
#
# Output: synthesized.md inside .pilot/ensemble/runs/<timestamp>-XXXX/
version: "0.1"
starting: spar

# Skill template — `pilot init-skill ensemble` writes this verbatim to
# .claude/skills/ensemble/SKILL.md so /ensemble works in Claude Code.
# The skill's bash injection wraps the user's bare question with the
# sparring framing before passing to pilot, so the pipeline itself
# stays generic ("ask N models the same thing in parallel and save").
skill: |
  ---
  name: ensemble
  description: |
    Spar with three independent models on a strategic, architectural, or product
    question. Surfaces dissent rather than consensus, returns three independent
    verdicts (COMMIT / DRAW / INSUFFICIENT). Use when the user wants a panel's
    view on a hard call, asks "what would other models say about X?", or asks
    for a second / third opinion on a non-trivial decision.
  allowed-tools: Bash(pilot-docker run *)
  ---

  The user asked: $ARGUMENTS

  Three independent models — none have seen this conversation — answered the
  same question in parallel. Their takes:

  ```!
  PROMPT=$(cat <<'PROMPT_END'
  You are a rigorous sparring partner. Tough love, no cheerleading, no filler.
  You are one of multiple sparring partners answering this question in parallel.

  Reason in depth. Show the chain. Make load-bearing assumptions explicit.
  Three honest verdict types are allowed:
  - COMMIT       — you have enough to take a side; take it.
  - DRAW         — answer is conditional; state which conditions tip each side.
  - INSUFFICIENT — name the 1–3 specific facts that would change your answer.

  Constraints:
  - Total response under ~500 words.
  - Do not refer to yourself, your name, or your model.
  - Reasoning artifact only — no code, configs, or specs unless explicitly asked.
  - Mark cited facts (R) for confident recall or (G) for guess.
  - Surface the strongest counter to your verdict and the asker's likely blind spot.
  - End with what you'd do if forced to commit today, even under DRAW/INSUFFICIENT.

  Format (use these exact headings):
  ## Read           one paragraph reframing what's actually being asked
  ## Reasoning      the chain of thought
  ## Verdict        COMMIT | DRAW | INSUFFICIENT, plus the verdict itself
  ## Strongest counter
  ## Blind spot
  ## If forced to commit today

  Question:
  $1
  PROMPT_END
  )
  pilot-docker run .pilot/ensemble/pipeline.yaml --var "QUESTION=$PROMPT" >&2
  cat "$(ls -td .pilot/ensemble/runs/* | head -1)/synthesized.md"
  ```

  Read the three takes above and surface to the user:
  1. Where the panel agrees (rare — call it out explicitly when it happens)
  2. Where they disagree, and which disagreement most matters for the user's
     actual decision
  3. Whether the panel collectively missed something the user might care about

pre_pipeline: |
  if [ -z "${QUESTION:-}" ]; then
    echo "ERROR: provide a question via --var QUESTION=\"your question\""
    exit 1
  fi

stages:
  spar:
    pre_step: |
      mkdir -p "$PILOT_CONFIG_DIR/runs"
      ROUND_DIR=$(mktemp -d "$PILOT_CONFIG_DIR/runs/$(date +%Y%m%d-%H%M%S)-XXXX")
      echo "<signal:var key=ROUND_DIR>$ROUND_DIR</signal:var>"
      echo "<signal:var key=OUTPUT_GLM5>$ROUND_DIR/glm5.md</signal:var>"
      echo "<signal:var key=OUTPUT_GPT5>$ROUND_DIR/gpt5.md</signal:var>"
      echo "<signal:var key=OUTPUT_GEMINI>$ROUND_DIR/gemini.md</signal:var>"
    prompt: |
      {{file:prompts/spar.md}}
    runners:
      - executor: opencode
        model: zai-coding-plan/glm-5.1
        vars:
          OUTPUT: "{{var:OUTPUT_GLM5}}"
      - executor: codex
        model: gpt-5.5
        vars:
          OUTPUT: "{{var:OUTPUT_GPT5}}"
      - executor: gemini
        model: gemini-3.1-pro-preview
        vars:
          OUTPUT: "{{var:OUTPUT_GEMINI}}"
    parallel: true
    min_success: 1
    per_runner_timeout: 1800
    on_signal:
      default: synthesize

  synthesize:
    runner:
      executor: shell
      command: |
        {
          for f in "$ROUND_DIR"/*.md; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .md)
            [ "$name" = "synthesized" ] && continue
            echo "# $name"
            echo
            cat "$f"
            echo
            echo "---"
            echo
          done
        } > "$ROUND_DIR/synthesized.md"
        echo "synthesized -> $ROUND_DIR/synthesized.md"
    on_signal:
      default: __succeed__
