# Ensemble pipeline — a panel of independent models answers the same question in parallel
#
# Run directly:
#   pilot run .pilot/ensemble/pipeline.yaml --var QUESTION="your question"
#
# Or install as a Claude Code skill, then /ensemble fires when Claude
# decides it needs outside perspective:
#   pilot init-skill ensemble
#
# Output: synthesized.md inside .pilot/ensemble/runs/<timestamp>-XXXX/
version: "0.1"
starting: spar

# Skill template — `pilot init-skill ensemble` writes this verbatim to
# .claude/skills/ensemble/SKILL.md. The skill instructs Claude (the
# caller) to construct the panel prompt itself, fitted to the
# situation, then run pilot via its Bash tool. The pipeline stays
# generic — "ask N models the same thing in parallel and save".
skill: |
  ---
  name: ensemble
  description: |
    A panel of independent models attacks the same decision in parallel —
    counsel without consensus, scrutiny without sycophancy. Each returns
    reasoning, verdict, and the strongest counter to whatever's being
    leaned toward. For decisions that can't be confirmed by facts:
    strategic, architectural, organizational, career, product. The panel
    exists to disagree. If a fact lookup or a code change would resolve
    the question, this is the wrong tool.
  allowed-tools: Bash(pilot-docker run *) Bash(cat *) Bash(ls *)
  effort: high
  ---

  You're consulting an independent panel — outside perspective on a
  non-trivial call you're working through. The panel does not see
  this conversation, your codebase, or your prior reasoning.
  Everything they need to give a useful answer has to be in the prompt
  you build.

  # Build the prompt

  The prompt is the artifact. Treat it as the brief you'd give a
  senior outsider you trusted: complete enough to answer without
  follow-up, sharp enough to provoke real thinking.

  Cover:

  - **The problem.** What's actually being decided. State it precisely.
  - **Progress so far.** What you've tried, what you've ruled out,
    what you currently think and why. Make your leaning explicit so
    the panel can attack it.
  - **The stuck point.** Where your reasoning runs out, what data
    you don't have, what you genuinely cannot decide alone.
  - **Files in the repo (use them).** The panel runs as full agents —
    claude-code, codex, gemini — each with file-read tools and your
    working directory inherited as their cwd. Any path you reference
    resolves the same way it does for you. Files matter not just for
    the *answer* but for the *context the panel needs to answer well*:
    the code the question is about, strategy or architecture docs,
    prior decisions, design notes, planning artifacts, README files.
    **Instruct the panel to read what's relevant** — be concrete about
    file paths, line ranges, grep patterns. Don't paste large snippets
    into the prompt when you can point at the source; pasting wastes
    tokens the panel could spend reasoning.
  - **Framing.** Pick what fits:
     - Sparring with verdicts (COMMIT / DRAW / INSUFFICIENT) for
       binary or near-binary calls with stakes.
     - Multiple-lens roleplay (assign each panelist a distinct role —
       skeptic, devil's advocate, operator, contrarian) for relational,
       organizational, or judgment calls.
     - Red-team for plans about to execute.
     - Whatever else suits the situation. These are starting points,
       not a menu.
  - **Demands.** Depth, dissent, the strongest counter, the blind
    spot you're least likely to see. Forbid sycophancy. Mark cited
    facts `(R)` for confident recall, `(G)` for guess. Cap each
    panelist at ~500 words.

  # Run the panel

  Mechanical contract — invoke verbatim, substituting your built
  prompt for the QUESTION value:

      pilot-docker run .pilot/ensemble/pipeline.yaml --var "QUESTION=<your prompt>" >&2
      cat "$(ls -td .pilot/ensemble/runs/* | head -1)/synthesized.md"

  The cat'd output is the panel's combined takes, separated by headers.

  # Use the result

  You called the panel because you needed perspective. Now you have
  takes from outside your context. Read them, then:

  1. Notice where the panel converges — rare; worth flagging.
  2. Notice where they diverge, and identify which divergence most
     matters for the specific decision you're working through.
  3. Notice what the panel collectively missed because they didn't
     see your conversation, your codebase, or your actual constraints.

  Do not soften their verdicts when integrating into your reasoning.
  Do not flatten dissent into consensus through restatement. The
  disagreement is the signal — the entire point of running this.

pre_pipeline: |
  if [ -z "${QUESTION:-}" ]; then
    echo "ERROR: provide a question via --var QUESTION=\"your question\""
    exit 1
  fi

stages:
  spar:
    pre_step: |
      mkdir -p "$PILOT_CONFIG_DIR/runs"
      ROUND_DIR=$(mktemp -d "$PILOT_CONFIG_DIR/runs/$(date +%Y%m%d-%H%M%S)-XXXX")
      printf '%s\n' "$QUESTION" > "$ROUND_DIR/question.md"
      echo "<signal:var key=ROUND_DIR>$ROUND_DIR</signal:var>"
      echo "<signal:var key=OUTPUT_GLM5>$ROUND_DIR/glm5.md</signal:var>"
      echo "<signal:var key=OUTPUT_GPT5>$ROUND_DIR/gpt5.md</signal:var>"
      echo "<signal:var key=OUTPUT_AGY>$ROUND_DIR/agy.md</signal:var>"
    prompt: |
      {{file:prompts/spar.md}}
    runners:
      - executor: opencode
        model: zai-coding-plan/glm-5.1
        vars:
          OUTPUT: "{{var:OUTPUT_GLM5}}"
      - executor: codex
        model: gpt-5.5
        vars:
          OUTPUT: "{{var:OUTPUT_GPT5}}"
      - executor: antigravity
        model: gemini-3.1-pro-high
        vars:
          OUTPUT: "{{var:OUTPUT_AGY}}"
    parallel: true
    min_success: 1
    per_runner_timeout: 1800
    on_signal:
      default: synthesize

  synthesize:
    runner:
      executor: shell
      command: |
        {
          for f in "$ROUND_DIR"/*.md; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .md)
            case "$name" in
              synthesized|question) continue ;;
            esac
            echo "# $name"
            echo
            cat "$f"
            echo
            echo "---"
            echo
          done
        } > "$ROUND_DIR/synthesized.md"
        echo "synthesized -> $ROUND_DIR/synthesized.md"
    on_signal:
      default: __succeed__
