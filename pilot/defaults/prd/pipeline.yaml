# PRD pipeline — gather → reviews → research → analyze → baseline → PRD
version: "0.1"
starting: gather

vars:
  PILOT_KEYWORDS: ""                       # Comma-separated: "habit tracker,daily habits,routine"
  PILOT_NUM_TOP_APPS: "5"
  PILOT_APPTWEAK_OUTPUT_DIR: "data/competitors"
  PILOT_REVIEW_COUNTRY: "us"               # Country code for App Store reviews
  PILOT_REVIEW_PAGES: "2"                  # Pages per app (50 reviews/page, max 10)
  PILOT_FINDINGS: "data/findings.md"       # Feature baseline (output of baseline stage)
  PILOT_RESEARCH: "data/research.md"       # Web research (output of research stage)
  PILOT_BRIEF: "brief.md"                 # User brief (relative to config dir)
  PILOT_PRD: "data/prd.md"               # Final PRD (output of prd stage)

pre_pipeline: |
  {{file:scripts/pre_pipeline.sh}}
on_pipeline_success: |
  {{file:scripts/cleanup.sh}}

stages:
  gather:
    runner:
      executor: shell
      command: |
        {{file:scripts/gather_apptweak.sh}}
    on_signal:
      ready: gather_reviews
      default: __fail__

  gather_reviews:
    runner:
      executor: shell
      command: |
        {{file:scripts/gather_reviews.sh}}
    on_signal:
      ready: research
      default: __fail__

  research:
    prompt: |
      {{file:prompts/research.md}}
    runner:
      executor: claude-code
      model: sonnet
    on_signal:
      completed: analyze
      default: __fail__

  analyze:
    prompt: |
      {{file:prompts/analyze.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: baseline
      default: __fail__

  baseline:
    prompt: |
      {{file:prompts/baseline.md}}
    runner:
      executor: claude-code
      model: sonnet
    on_signal:
      completed: prd
      default: __fail__

  prd:
    prompt: |
      {{file:prompts/prd.md}}
    runner:
      executor: claude-code
      model: opus
    
    on_signal:
      completed: __succeed__
      default: __fail__
