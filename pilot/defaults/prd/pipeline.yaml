# PRD pipeline — gather → reviews → research → analyze → baseline → PRD → review loop
version: "0.1"
starting: gather

# Environment variables:
#   APPTWEAK_API_KEY — required. Set in .env or export before running.
#                      Get yours at https://www.apptweak.com

vars:
  PILOT_KEYWORDS: ""                       # REQUIRED. Comma-separated: "habit tracker,daily habits,routine"
  PILOT_NUM_TOP_APPS: "5"
  PILOT_APPTWEAK_OUTPUT_DIR: "data/competitors"
  PILOT_REVIEW_COUNTRY: "us"               # Country code for App Store reviews
  PILOT_REVIEW_PAGES: "5"                  # Pages per app (50 reviews/page, max 10)
  PILOT_FINDINGS: "data/findings.md"       # Feature baseline (output of baseline stage)
  PILOT_RESEARCH: "data/research.md"       # Web research (output of research stage)
  PILOT_BRIEF: "brief.md"                 # User brief (optional, relative to config dir)
  PILOT_PRD: "data/prd.md"               # Final PRD (output of prd stage)
  PILOT_PRD_QA: "data/prd_qa.md"         # Human Q&A pack for unresolved material uncertainties
  PILOT_LANGUAGES: "English, Spanish, German, French, Portuguese, Dutch"
  PILOT_PRD_ROUND: "1"                  # Current refinement round (managed by refine_critique)
  PILOT_PRD_REFINE_ROUNDS: "3"          # Max refinement rounds (safety cap)
  PILOT_REVIEW_CODEX: "data/review_codex.md"     # Codex review output
  PILOT_REVIEW_GEMINI: "data/review_gemini.md"    # Gemini review output

pre_pipeline: |
  {{file:scripts/pre_pipeline.sh}}
on_pipeline_success: |
  {{file:scripts/cleanup.sh}}
  bash ../scripts/notify.sh
on_pipeline_failure: bash ../scripts/notify.sh

stages:
  gather:
    runner:
      executor: shell
      command: |
        {{file:scripts/gather_apptweak.sh}}
    on_signal:
      ready: gather_reviews
      default: __fail__

  gather_reviews:
    runner:
      executor: shell
      command: |
        {{file:scripts/gather_reviews.sh}}
    on_signal:
      ready: research
      default: __fail__

  research:
    prompt: |
      {{file:prompts/research.md}}
    runner:
      executor: gemini
      model: gemini-3.1-pro-preview
    fallback_runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: analyze
      default: __fail__

  analyze:
    prompt: |
      {{file:prompts/analyze.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: baseline
      default: __fail__

  baseline:
    prompt: |
      {{file:prompts/baseline.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: prd
      default: __fail__

  prd:
    prompt: |
      {{file:prompts/prd.md}}
    runner:
      executor: claude-code
      model: opus
    
    on_signal:
      completed: review_codex
      default: __fail__

  review_codex:
    pre_step: |
      echo "PILOT_REVIEW_OUTPUT=data/review_codex.md" >> "$PILOT_CONFIG_DIR/vars"
    prompt: |
      {{file:prompts/review.md}}
    runner:
      executor: codex
      model: gpt-5.4
    on_signal:
      default: review_gemini

  review_gemini:
    pre_step: |
      echo "PILOT_REVIEW_OUTPUT=data/review_gemini.md" >> "$PILOT_CONFIG_DIR/vars"
    prompt: |
      {{file:prompts/review.md}}
    runner:
      executor: gemini
      model: gemini-3.1-pro-preview
    on_signal:
      default: refine_critique

  refine_critique:
    prompt: |
      {{file:prompts/refine_critique.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      repeat: review_codex
      default: __succeed__
