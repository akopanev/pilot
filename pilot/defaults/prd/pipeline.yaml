# PRD pipeline — research competitors → analyze features → generate PRD
version: "0.1"
starting: gather

vars:
  PILOT_KEYWORDS: ""                       # Comma-separated: "habit tracker,daily habits,routine"
  PILOT_NUM_TOP_APPS: "5"
  PILOT_APPTWEAK_OUTPUT_DIR: "data/competitors"
  PILOT_FINDINGS: "findings.md"            # Competitor feature baseline (output of analyze)

pre_pipeline: |
  {{file:scripts/pre_pipeline.sh}}
on_pipeline_success: |
  {{file:scripts/cleanup.sh}}

stages:
  gather:
    runner:
      executor: shell
      command: |
        {{file:scripts/gather.sh}}
    on_signal:
      ready: analyze
      failed: __fail__
      default: __succeed__

  analyze:
    prompt: |
      {{file:prompts/analyze.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: __succeed__
      failed: __fail__
      default: __succeed__
