# Development pipeline — pick -> implement -> review -> fix cycle
version: "0.1"
starting: pick

# Exported as env vars every round (key = var name)
vars:
  PILOT_DEFAULT_BRANCH: master
  PILOT_EPIC: ""                         # Epic ticket ID to work on (e.g., "tk-a1b2"). Tasks outside this epic are ignored.
  PILOT_MOBILE_DIR: "mobile"             # Mobile app subfolder inside project root

pre_pipeline: |
  set -euo pipefail

  MOBILE_DIR="$PILOT_CONFIG_DIR/../../$PILOT_MOBILE_DIR"

  if ! command -v npx &>/dev/null; then
    echo "npx not found — install Node.js first"
    exit 1
  fi

  # Install gluestack-ui in mobile app if not already set up
  if [ ! -d "$MOBILE_DIR" ]; then
    echo "Warning: $PILOT_MOBILE_DIR/ not found, skipping gluestack-ui init"
  elif [ -d "$MOBILE_DIR/components/ui/gluestack-ui-provider" ]; then
    echo "gluestack-ui already initialized in $PILOT_MOBILE_DIR/"
  elif [ ! -f "$MOBILE_DIR/package.json" ]; then
    echo "Warning: no package.json in $PILOT_MOBILE_DIR/, skipping gluestack-ui init"
  else
    cd "$MOBILE_DIR"
    echo "Initializing gluestack-ui in $PILOT_MOBILE_DIR/..."
    npx gluestack-ui@alpha init -y 2>&1 || {
      echo "Warning: gluestack-ui init failed, continuing without it"
    }
    echo "Adding all gluestack-ui components..."
    npx gluestack-ui@alpha add --all -y 2>&1 || {
      echo "Warning: gluestack-ui add --all failed"
    }
  fi

  echo "Pre-pipeline OK"

stages:
  # Pick next task from tracker, create feature branch
  pick:
    runner:
      executor: shell
      command: |
        {{file:scripts/pick.sh}}
    on_signal:
      ready: implement      # task picked — go implement
      completed: __succeed__   # no tasks left — done
      failed: __fail__      # fatal error
      default: __fail__         # retry

  # Implement the task (codex primary, claude fallback)
  implement:
    prompt: |
      {{file:prompts/implement.md}}
    runner:
      executor: opencode
      model: zai-coding-plan/glm-5
    fallback_runner:
      executor: claude-code
      model: sonnet
    on_signal:
      failed: __fail__      # agent failed
      default: verify       # always goes to verify gate

  # Verify gate — typecheck, lint, tests (mechanical check)
  verify:
    runner:
      executor: shell
      command: |
        {{file:scripts/verify.sh}}
    on_signal:
      approved: review      # checks pass — send to reviewer
      rejected: fix         # checks fail — note added, send to fix
      failed: __fail__      # fatal error
      default: review       # no signal — retry

  # Code review — approve or reject
  review:
    prompt: |
      {{file:prompts/review.md}}
    runner:
      executor: codex
      model: gpt-5.3-codex
    on_signal:
      approved: merge       # pass — squash merge
      rejected: fix         # fail — send back for fixes
      stuck: escalate       # Catch-22 detected — escalate to chairman
      failed: __fail__      # agent failed
      default: review       # no signal — retry review

  # Squash merge feature branch, close task, clean up
  merge:
    runner:
      executor: shell
      command: |
        {{file:scripts/merge.sh}}
    on_signal:
      failed: __fail__      # merge failed
      default: pick         # back to picking next task

  # Address review feedback
  fix:
    prompt: |
      {{file:prompts/fix.md}}
    runner:
      executor: codex
      model: gpt-5.3-codex
    fallback_runner:
      executor: claude-code
      model: sonnet
    on_signal:
      stuck: escalate       # contradictions detected — escalate to chairman
      failed: __fail__      # agent failed
      default: verify       # always back through verify gate

  # Escalation — "chairman" resolves stuck fix/review loops
  escalate:
    prompt: |
      {{file:prompts/escalate.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      approve: merge        # override: code is correct, merge it
      skip: __fail__        # task is broken, human must look
      failed: __fail__      # fatal error
      default: __fail__     # can't resolve — human must look
