# Design pipeline — PRD → screens → theme → enriched screens
# Runs after PRD pipeline, before plan pipeline.
# Pre-pipeline installs gluestack agent-skills + gluestack-ui.
version: "0.1"
starting: screens

on_pipeline_success: bash ../scripts/notify.sh
on_pipeline_failure: bash ../scripts/notify.sh

vars:
  PILOT_PRD: "../prd/data/prd.md"
  PILOT_APPTWEAK_OUTPUT_DIR: "../prd/data/competitors"
  PILOT_SCREENS: "data/screens.yaml"
  PILOT_SCREENS_DIR: "data/screens"                      # Per-screen detail files ({screen_id}.yaml)
  PILOT_THEME: "data/theme.yaml"
  PILOT_DESIGN_REFS: "../../design-refs"                # Reference designs — screenshots, mockups (optional)

pre_pipeline: |
  set -euo pipefail

  PROJECT_DIR="$PILOT_CONFIG_DIR/../../"
  MOBILE_DIR="$PROJECT_DIR/mobile"

  if [ ! -d "$PROJECT_DIR" ]; then
    echo "Project root not found: $PROJECT_DIR"
    exit 1
  fi

  if ! command -v npx &>/dev/null; then
    echo "npx not found — install Node.js first"
    exit 1
  fi

  # --- 1. Agent skills (AI-readable component docs, project root) ---
  cd "$PROJECT_DIR"
  if [ -d ".agents/skills/gluestack-ui-v4" ]; then
    echo "gluestack agent-skills already installed"
  else
    echo "Installing gluestack agent-skills..."
    npx skills add gluestack/agent-skills --skill gluestack-ui-v4 -y 2>&1 || {
      echo "Warning: failed to install agent-skills, continuing without them"
    }
  fi

  echo "Pre-pipeline OK"

stages:
  screens:
    prompt: |
      {{file:prompts/screens.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: theme
      default: __fail__

  theme:
    prompt: |
      {{file:prompts/theme.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: detail
      default: __fail__

  detail:
    prompt: |
      {{file:prompts/detail.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      completed: __succeed__
      default: __fail__
