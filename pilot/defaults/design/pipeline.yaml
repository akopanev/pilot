# Design pipeline — PRD → screens → theme → detail → review loop → Figma briefs
# Runs after PRD pipeline, before plan pipeline.
# Final output: self-contained per-screen briefs for Figma Make.
version: "0.1"
starting: screens

on_pipeline_success: bash ../scripts/notify.sh
on_pipeline_failure: bash ../scripts/notify.sh

vars:
  PILOT_PRD: "../prd/data/prd.md"
  PILOT_APPTWEAK_OUTPUT_DIR: "../prd/data/competitors"
  PILOT_SCREENS: "data/screens.yaml"
  PILOT_SCREENS_DIR: "data/screens"                      # Per-screen detail files ({screen_id}.yaml)
  PILOT_THEME: "data/theme.yaml"
  PILOT_DESIGN_REFS: "../../design-refs"                # Reference designs — screenshots, mockups (optional)
  PILOT_BRIEFS_DIR: "data/briefs"                       # Self-contained per-screen briefs for Figma Make
  PILOT_REVIEW_CODEX: "data/review_codex.md"            # Codex design review
  PILOT_REVIEW_GEMINI: "data/review_gemini.md"          # Gemini design review
  PILOT_DESIGN_ROUND: "1"                               # Current refinement round
  PILOT_DESIGN_REFINE_ROUNDS: "3"                       # Max refinement rounds

stages:
  screens:
    prompt: |
      {{file:prompts/screens.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      default: theme

  theme:
    prompt: |
      {{file:prompts/theme.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      default: detail

  detail:
    prompt: |
      {{file:prompts/detail.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      default: review_codex

  review_codex:
    pre_step: |
      echo "PILOT_REVIEW_OUTPUT=data/review_codex.md" >> "$PILOT_CONFIG_DIR/vars"
    prompt: |
      {{file:prompts/review.md}}
    runner:
      executor: codex
      model: gpt-5.4
    on_signal:
      default: review_gemini

  review_gemini:
    pre_step: |
      echo "PILOT_REVIEW_OUTPUT=data/review_gemini.md" >> "$PILOT_CONFIG_DIR/vars"
    prompt: |
      {{file:prompts/review.md}}
    runner:
      executor: gemini
      model: gemini-3.1-pro-preview
    on_signal:
      default: refine_critique

  refine_critique:
    prompt: |
      {{file:prompts/refine_critique.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      repeat: review_codex
      default: briefs

  briefs:
    prompt: |
      {{file:prompts/briefs.md}}
    runner:
      executor: claude-code
      model: opus
    on_signal:
      default: __succeed__
