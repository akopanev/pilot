version: 0.1

tracker:
  adapter: ticket
  commands:
    next_ready: "tk ready | head -n 1"
    start: "tk start {id}"
    close: "tk close {id}"
    reopen: "tk reopen {id}"
    note: "tk add-note {id} {text}"

loop:
  mode: serial
  stop_on_verify_fail: true


stages:
  implement:
    
    prompts:
      - .pilot/prompts/signals.md
      - .pilot/prompts/implement.md
    
    runner:
      executor: codex
      model: o3

    fallback_runner:
      executor: claude-code
      model: sonnet

    on_signal:
      completed:
      default:
        to: review

  fix:
    prompts:
      - .pilot/prompts/signals.md
      - .pilot/prompts/implement.md
    
    runner:
      executor: codex
      model: o3

    fallback_runner:
      executor: claude-code
      model: sonnet

    on_signal:
      completed:
      default:
        to: review

    on_signal:
      completed:
      default:
        to: review
      

  review:
    prompts:
      - .pilot/prompts/signals.md
      - .pilot/prompts/implement.md  

    runner:
      executor: codex
      model: o3

    fallback_runner:
      executor: claude-code
      model: sonnet  

    on_signal:
      approved:
        to: implement

      rejected:
        to: fix

  



stages:
  implement:
    enabled: true
    model:
      primary:
        engine: codex
        model: o3
      fallback:
        engine: claude-code
        model: sonnet
    prompt_files:
      - .pilot/prompts/signals.md
      - .pilot/prompts/implement.md

  review:
    enabled: false
    model:
      primary:
        engine: codex
        model: o3
      fallback:
        engine: claude-code
        model: sonnet
    prompt_files:
      - .pilot/prompts/review.md

verify:
  default_command: "pnpm typecheck"
  per_tag:
    backend: "cd backend/functions && npm run build"
    mobile: "cd mobile && pnpm typecheck"

signals:
  control:
    - human
  telemetry:
    - update
